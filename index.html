<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jurnal Mengajar Guru</title>
  <style>
    *, *:before, *:after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <!-- Ganti src di bawah dengan URL /exec Web App Anda -->
  <iframe 
    allow="geolocation; microphone; camera; midi; encrypted-media; autoplay" 
    allowfullscreen="true" 
    src="https://script.google.com/macros/s/AKfycbzLr5E5IhN4NceBqOZzs4-W_AEMOUQeDd7rVZwNg3cJ/exec">
  </iframe>

</body>
</html>
